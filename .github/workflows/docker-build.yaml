name: Docker Build

on:
  workflow_call:
    inputs:
      image-name:
        description: "Package/image name on GHCR (defaults to the calling repository's name)"
        type: string
        required: false
        default: ${{ github.event.repository.name }}
      context:
        description: "Docker build context"
        type: string
        required: false
        default: "."
      dockerfile:
        description: "Path to the Dockerfile"
        type: string
        required: false
        default: "Dockerfile"
      tags:
        description: "Tag rules passed to docker/metadata-action. Include type=ref,event=pr to tag pull request builds as pr-<number>"
        type: string
        required: false
        default: |
          type=ref,event=tag
          type=ref,event=branch
          type=ref,event=pr
      push:
        description: "Whether to push the built image to GHCR"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
          tags: ${{ inputs.tags }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
