name: Docker Clean PR Image

on:
  workflow_call:
    inputs:
      image-name:
        description: "Package/image name on GHCR (defaults to the calling repository's name)"
        type: string
        required: false
        default: ${{ github.event.repository.name }}
      pr-number:
        description: "Pull request number whose pr-<number> tagged image should be deleted"
        type: number
        required: true
    secrets:
      package-token:
        description: "Token with delete:packages scope, needed when the package is owned by a personal account rather than an org (falls back to GITHUB_TOKEN)"
        required: false

permissions:
  packages: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete PR image
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: ${{ inputs.image-name }}
          tags: pr-${{ inputs.pr-number }}
          token: ${{ secrets.package-token || secrets.GITHUB_TOKEN }}
